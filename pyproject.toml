[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghetto-city-bot"
version = "0.1.0"
description = "VK text RPG bot"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "vk-api>=11.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
